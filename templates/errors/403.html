<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureSync – 403 Forbidden</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="subtle-bg-pattern"></div>
    <div class="auth-container" style="text-align: center; max-width: 520px;">
        <div class="auth-card card" style="padding: 40px 32px;">
            <div style="font-family: var(--font-mono); font-size: 4.5rem; font-weight: 800; color: var(--red-threat); line-height: 1; margin-bottom: 12px;">
                403
            </div>
            <h2 style="margin: 8px 0 12px; color: var(--text-primary); font-size: 1.4rem; font-weight: 800;">Access Denied: Zero-Trust Perimeter</h2>
            <p style="color: var(--text-secondary); max-width: 440px; margin: 0 auto 28px; font-size: 0.92rem; line-height: 1.6;">
                You do not possess the required tenant privileges or clearance to access this resource. All cross-tenant access attempts are blocked and logged.
            </p>
            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <a href="{{ url_for('dashboard') }}" class="btn-primary" style="padding: 10px 22px;">
                    Return to Dashboard
                </a>
                <a href="{{ url_for('login') }}" class="btn-secondary" style="padding: 10px 22px;">
                    Sign In
                </a>
            </div>
        </div>
    </div>
</body>
</html>

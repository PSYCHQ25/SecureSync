<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureSync – 403 Forbidden</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="cyber-grid-overlay"></div>
    <div class="auth-container" style="text-align: center;">
        <div style="font-family: var(--font-mono); font-size: 5rem; font-weight: 800; color: var(--red-threat); text-shadow: 0 0 20px var(--red-glow);">
            403
        </div>
        <h2 style="margin: 12px 0; color: var(--text-primary);">Access Denied: Zero-Trust Perimeter</h2>
        <p style="color: var(--text-secondary); max-width: 480px; margin: 0 auto 24px; font-size: 0.95rem; line-height: 1.6;">
            You do not possess the required tenant privileges or clearance to access this resource. All cross-tenant access attempts are blocked and logged.
        </p>
        <div style="display: flex; gap: 12px; justify-content: center;">
            <a href="{{ url_for('dashboard') }}" class="btn-primary" style="text-decoration: none; padding: 12px 24px;">
                Return to Dashboard
            </a>
            <a href="{{ url_for('login') }}" class="btn-primary" style="text-decoration: none; padding: 12px 24px; background: transparent; border: 1px solid var(--border-color);">
                Sign In
            </a>
        </div>
    </div>
</body>
</html>
